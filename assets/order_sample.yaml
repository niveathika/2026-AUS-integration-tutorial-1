openapi: 3.0.3
info:
  title: Order Service API
  version: 1.0.0
  description: A simple order management service for the WSO2 Integrator demo.

servers:
  - url: http://localhost:9090/orders
    description: Local development server

tags:
  - name: orders
    description: Create, retrieve, and manage customer orders

paths:
  /orders:
    get:
      operationId: listOrders
      summary: List all orders
      tags:
        - orders
      parameters:
        - name: status
          in: query
          description: Filter orders by status
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: limit
          in: query
          description: Maximum number of orders to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      operationId: createOrder
      summary: Create a new order
      tags:
        - orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        description: Unique identifier of the order
        schema:
          type: string
    get:
      operationId: getOrder
      summary: Get an order by ID
      tags:
        - orders
      responses:
        '200':
          description: The requested order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: cancelOrder
      summary: Cancel an order
      tags:
        - orders
      responses:
        '204':
          description: Order cancelled successfully
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    OrderRequest:
      type: object
      required:
        - customerId
        - items
      properties:
        customerId:
          type: string
          description: Identifier of the customer placing the order
        items:
          type: array
          description: Line items included in the order
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'

    Order:
      type: object
      required:
        - id
        - customerId
        - items
        - status
        - total
      properties:
        id:
          type: string
          description: Unique identifier of the order
        customerId:
          type: string
          description: Identifier of the customer who placed the order
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          $ref: '#/components/schemas/OrderStatus'
        total:
          type: number
          format: double
          description: Total amount for the order
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the order was created

    OrderItem:
      type: object
      required:
        - productId
        - quantity
        - price
      properties:
        productId:
          type: string
          description: Identifier of the product
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: Number of units ordered
        price:
          type: number
          format: double
          description: Unit price of the product

    OrderStatus:
      type: string
      description: Lifecycle status of an order
      enum:
        - PENDING
        - CONFIRMED
        - SHIPPED
        - DELIVERED
        - CANCELLED

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error description
